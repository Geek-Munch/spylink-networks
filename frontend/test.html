<!DOCTYPE html>
<html>
<head><title>Spylink Test</title></head>
<body>
<h1>Spylink Networks</h1>
<p>If you see this, the frontend is serving files.</p>
<script>
fetch('https://spylink-backend.onrender.com/api/packages/')
  .then(r => r.json())
  .then(data => document.body.innerHTML += `<pre>API Response: ${JSON.stringify(data, null, 2)}</pre>`)
  .catch(e => document.body.innerHTML += `<p>Error: ${e.message}</p>`);
</script>
</body>
</html>
